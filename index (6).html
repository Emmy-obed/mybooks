<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Obediah Books | Simple, practical books for accountants and business owners</title>
<meta name="description" content="Beginner-friendly books on Excel, accounting and AI by Obediah Emmanuel John. Buy on WhatsApp.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F6F9F7; --surface:#FFFFFF; --surface2:#EEF5F1; --text:#14231C; --muted:#56675E;
  --brand:#0B6E4F; --brand-ink:#FFFFFF; --deep:#0B3B2E; --gold:#F2A900; --gold-ink:#1B1400;
  --wa:#0E8A45; --wa-ink:#FFFFFF; --line:#DCE6E0; --shadow:0 10px 30px rgba(11,59,46,.10);
  --radius:16px;
  --font-body:'Plus Jakarta Sans',system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif;
  --font-head:'Fraunces',Georgia,'Times New Roman',serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0B1511; --surface:#12211B; --surface2:#172A22; --text:#EAF3EE; --muted:#9DB2A8;
    --brand:#35C493; --brand-ink:#04251B; --line:#243A30; --shadow:0 10px 30px rgba(0,0,0,.35);
  }
}
:root[data-theme="dark"]{
  --bg:#0B1511; --surface:#12211B; --surface2:#172A22; --text:#EAF3EE; --muted:#9DB2A8;
  --brand:#35C493; --brand-ink:#04251B; --line:#243A30; --shadow:0 10px 30px rgba(0,0,0,.35);
}
html{height:100%;scroll-padding-top:calc(env(safe-area-inset-top,0px) + 76px);scroll-behavior:smooth}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;min-height:100%;background:var(--bg);color:var(--text);font-family:var(--font-body);font-size:16px;line-height:1.6;-webkit-font-smoothing:antialiased}
img{max-width:100%;display:block}
a{color:inherit}
h1,h2,h3{font-family:var(--font-head);line-height:1.15;margin:0 0 .5em;letter-spacing:-.01em}
h1{font-size:clamp(2rem,5.2vw,3.4rem)}
h2{font-size:clamp(1.55rem,3.4vw,2.2rem)}
h3{font-size:1.2rem}
p{margin:0 0 1em}
.wrap{width:100%;max-width:1120px;margin:0 auto;padding:0 20px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.55rem;border:0;border-radius:999px;padding:.95rem 1.6rem;font:600 1rem var(--font-body);text-decoration:none;cursor:pointer;transition:transform .15s,box-shadow .15s,background .15s;text-align:center}
.btn:hover{transform:translateY(-2px)}
.btn:focus-visible,a:focus-visible,summary:focus-visible{outline:3px solid var(--gold);outline-offset:3px}
.btn-gold{background:var(--gold);color:var(--gold-ink);box-shadow:0 8px 20px rgba(242,169,0,.35)}
.btn-gold:hover{box-shadow:0 12px 26px rgba(242,169,0,.5)}
.btn-wa{background:var(--wa);color:var(--wa-ink)}
.btn-line{background:transparent;color:var(--text);border:2px solid var(--line)}
.btn-line:hover{border-color:var(--brand)}
.btn-lg{padding:1.1rem 2rem;font-size:1.08rem}
.btn-sm{padding:.55rem 1.05rem;font-size:.92rem}
.btn svg{width:1.2em;height:1.2em;flex:none}

/* header */
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:50;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;justify-content:space-between;height:64px;gap:12px}
.brand{white-space:nowrap;display:flex;align-items:center;gap:10px;text-decoration:none;font-family:var(--font-head);font-weight:700;font-size:1.2rem;color:var(--text)}
.logo{width:34px;height:34px;border-radius:10px;background:var(--deep);display:grid;place-items:center;color:var(--gold);font-weight:700;font-size:1rem;flex:none}
nav.menu{display:flex;align-items:center;gap:22px}
nav.menu a.link{font-weight:600;font-size:.95rem;text-decoration:none;color:var(--muted);cursor:pointer}
nav.menu a.link:hover{color:var(--brand)}
@media (max-width:720px){nav.menu a.link{display:none}.fab span{display:none}.fab{padding:.85rem}.fab svg{width:26px;height:26px}.hero .art img{transform:none!important}}

/* hero */
.hero{background:radial-gradient(1000px 500px at 85% -10%,#14705080,transparent 60%),linear-gradient(160deg,#0B3B2E,#082A21 70%);color:#fff;overflow:hidden;position:relative}
.hero::before{content:"";position:absolute;inset:0;background-image:linear-gradient(rgba(255,255,255,.04) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.04) 1px,transparent 1px);background-size:36px 36px;pointer-events:none}
.hero .wrap{position:relative;display:grid;grid-template-columns:1.1fr .9fr;gap:40px;align-items:center;padding-top:64px;padding-bottom:72px}
.eyebrow{display:inline-block;background:rgba(242,169,0,.15);color:#FFD066;border:1px solid rgba(242,169,0,.4);padding:.3rem .8rem;border-radius:999px;font-size:.8rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;margin-bottom:1.1rem}
.hero h1 em{font-style:normal;color:var(--gold)}
.hero p.lead{font-size:1.12rem;color:#CFE5DB;max-width:34rem}
.hero .cta{display:flex;flex-wrap:wrap;gap:12px;margin-top:1.4rem}
.hero .art{display:flex;justify-content:center}
.hero .art img{width:min(290px,70%);border-radius:10px;box-shadow:0 30px 60px rgba(0,0,0,.5);transform:rotate(3deg);transition:transform .3s}
.hero .art a:hover img{transform:rotate(0) scale(1.03)}
@media (max-width:820px){.hero .wrap{grid-template-columns:1fr;padding-top:40px;padding-bottom:48px}.hero .art{order:-1}.hero .art img{width:min(200px,55%)}}

/* sections */
section{padding:64px 0}
.sec-head{max-width:40rem;margin-bottom:2rem}
.sec-head p{color:var(--muted)}
.kicker{color:var(--brand);font-weight:700;font-size:.8rem;letter-spacing:.08em;text-transform:uppercase;margin-bottom:.5rem}

/* book grid */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:24px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;display:flex;flex-direction:column;text-decoration:none;transition:transform .2s,box-shadow .2s;box-shadow:var(--shadow)}
.card:hover{transform:translateY(-5px);box-shadow:0 18px 40px rgba(11,59,46,.18)}
.card .cv{background:var(--surface2);padding:24px;display:grid;place-items:center}
.card .cv img{width:62%;border-radius:6px;box-shadow:0 14px 28px rgba(0,0,0,.28)}
.card .bd{padding:18px 20px 20px;display:flex;flex-direction:column;gap:8px;flex:1}
.card h3{margin:0;font-size:1.18rem}
.card .sub{color:var(--muted);font-size:.94rem;margin:0}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{background:var(--surface2);color:var(--muted);border-radius:999px;padding:.2rem .65rem;font-size:.78rem;font-weight:600}
.price-row{display:flex;align-items:center;justify-content:space-between;margin-top:auto;padding-top:10px}
.price{font-family:var(--font-head);font-weight:700;font-size:1.5rem;color:var(--brand)}
.card.soon{border-style:dashed;box-shadow:none;background:transparent;justify-content:center;align-items:center;text-align:center;padding:30px 20px;gap:10px;min-height:340px}
.card.soon:hover{transform:none;box-shadow:none}

/* steps */
.steps{display:grid;grid-template-columns:repeat(3,1fr);gap:20px;counter-reset:s}
.step{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:24px;position:relative}
.step::before{counter-increment:s;content:counter(s);display:grid;place-items:center;width:38px;height:38px;border-radius:50%;background:var(--deep);color:var(--gold);font-weight:700;margin-bottom:12px}
.step p{color:var(--muted);margin:0;font-size:.96rem}
@media (max-width:760px){.steps{grid-template-columns:1fr}}

/* about */
.about{display:grid;grid-template-columns:auto 1fr;gap:24px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:28px}
.avatar{width:86px;height:86px;border-radius:50%;background:var(--deep);color:var(--gold);display:grid;place-items:center;font-family:var(--font-head);font-weight:700;font-size:1.8rem}
@media (max-width:560px){.about{grid-template-columns:1fr}}

/* book page */
.crumb{display:inline-flex;align-items:center;gap:6px;font-weight:600;font-size:.94rem;color:var(--muted);text-decoration:none;padding:20px 0 6px;cursor:pointer}
.crumb:hover{color:var(--brand)}
.bk{display:grid;grid-template-columns:360px 1fr;gap:48px;align-items:start;padding-bottom:40px}
.bk .left{position:sticky;top:calc(env(safe-area-inset-top,0px) + 84px)}
.bk .left .frame{background:linear-gradient(160deg,var(--surface2),var(--surface));border:1px solid var(--line);border-radius:var(--radius);padding:30px;display:grid;place-items:center}
.bk .left img{width:78%;border-radius:6px;box-shadow:0 24px 50px rgba(0,0,0,.35)}
.bk h1{font-size:clamp(1.9rem,4vw,2.8rem)}
.bk .sub{font-size:1.1rem;color:var(--muted)}
.buybox{background:var(--surface);border:2px solid var(--gold);border-radius:var(--radius);padding:22px;margin:22px 0;box-shadow:var(--shadow)}
.buybox .big{font-family:var(--font-head);font-size:2.3rem;font-weight:700;color:var(--brand);line-height:1}
.buybox .once{color:var(--muted);font-size:.9rem;margin:.3rem 0 1rem}
.buybox .btns{display:flex;flex-wrap:wrap;gap:10px}
.trust{list-style:none;padding:0;margin:14px 0 0;display:grid;gap:6px;font-size:.92rem;color:var(--muted)}
.trust li::before{content:"✓";color:var(--brand);font-weight:700;margin-right:8px}
.ticks{list-style:none;padding:0;margin:0;display:grid;gap:12px}
.ticks li{position:relative;padding-left:32px}
.ticks li::before{content:"✓";position:absolute;left:0;top:2px;width:22px;height:22px;border-radius:50%;background:var(--brand);color:var(--brand-ink);display:grid;place-items:center;font-size:.8rem;font-weight:700}
.ticks.x li::before{content:"–";background:var(--muted);color:var(--surface)}
.blk{margin-top:38px}
.learn{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.learn .it{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px 14px 48px;position:relative;font-size:.97rem}
.learn .it::before{content:"✓";position:absolute;left:14px;top:14px;width:24px;height:24px;border-radius:50%;background:var(--gold);color:var(--gold-ink);display:grid;place-items:center;font-weight:700;font-size:.85rem}
.two{display:grid;grid-template-columns:1fr 1fr;gap:20px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:22px}
.quote{background:var(--deep);color:#fff;border-radius:var(--radius);padding:26px 28px;font-family:var(--font-head);font-size:1.25rem;line-height:1.4}
.quote small{display:block;font-family:var(--font-body);font-size:.88rem;color:#BFE3D3;margin-top:10px}
details{background:var(--surface);border:1px solid var(--line);border-radius:12px;margin-bottom:10px;overflow:hidden}
summary{cursor:pointer;padding:15px 18px;font-weight:600;list-style:none;display:flex;justify-content:space-between;gap:12px;align-items:center}
summary::-webkit-details-marker{display:none}
summary::after{content:"+";font-size:1.4rem;color:var(--brand);line-height:1;flex:none}
details[open] summary::after{content:"–"}
details .in{padding:0 18px 16px;color:var(--muted);font-size:.96rem}
details .in ul{margin:.2rem 0 0;padding-left:1.2rem}
details .in li{margin:.25rem 0}
.previews{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
.pv{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:8px;cursor:zoom-in;text-align:left;font:inherit;color:inherit}
.pv img{border-radius:6px;width:100%}
.pv span{display:block;font-size:.8rem;color:var(--muted);padding:8px 4px 2px}
.pv:hover{border-color:var(--brand)}
@media (max-width:900px){.previews{grid-template-columns:repeat(2,1fr)}}
.table{width:100%;border-collapse:collapse;font-size:.95rem}
.table td{padding:10px 4px;border-bottom:1px solid var(--line)}
.table td:first-child{color:var(--muted);width:42%}
.table td:last-child{font-weight:600}
.final{background:linear-gradient(160deg,#0B3B2E,#082A21);color:#fff;border-radius:22px;padding:42px 28px;text-align:center;margin-top:48px}
.final p{color:#CFE5DB;max-width:36rem;margin:0 auto 1.4rem}
@media (max-width:900px){
  .bk{grid-template-columns:1fr;gap:20px}
  .bk .left{position:static}
  .bk .left .frame{padding:20px}
  .bk .left img{width:58%}
  .learn,.two{grid-template-columns:1fr}
}
.stickybuy{display:none}
@media (max-width:900px){
  .stickybuy{display:flex;position:fixed;left:0;right:0;bottom:0;z-index:60;background:var(--surface);border-top:1px solid var(--line);padding:10px 16px calc(10px + env(safe-area-inset-bottom,0px));align-items:center;justify-content:space-between;gap:12px;box-shadow:0 -8px 24px rgba(0,0,0,.12)}
  .stickybuy .p{font-family:var(--font-head);font-weight:700;font-size:1.35rem;color:var(--brand);line-height:1.1}
  .stickybuy .p small{display:block;font:500 .72rem var(--font-body);color:var(--muted)}
  body.bookpage{padding-bottom:84px}
}

/* floating whatsapp */
.fab{position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:55;background:var(--wa);color:#fff;border-radius:999px;padding:.8rem 1.1rem;display:flex;align-items:center;gap:8px;font-weight:700;text-decoration:none;box-shadow:0 10px 24px rgba(0,0,0,.3)}
.fab svg{width:22px;height:22px}
body.bookpage .fab{display:none}

footer{background:var(--deep);color:#CFE5DB;padding:40px 0 calc(40px + env(safe-area-inset-bottom,0px));margin-top:30px}
footer .wrap{display:flex;flex-wrap:wrap;gap:20px;justify-content:space-between;align-items:center}
footer a{color:#fff}
footer small{color:#9FC4B4}
body.bookpage footer{margin-bottom:0}

/* lightbox */
.lb{position:fixed;inset:0;background:rgba(0,0,0,.86);z-index:100;display:none;align-items:center;justify-content:center;padding:20px;cursor:zoom-out}
.lb.on{display:flex}
.lb img{max-height:92vh;max-width:min(94vw,640px);border-radius:8px;box-shadow:0 20px 60px rgba(0,0,0,.6)}
.lb button{position:absolute;top:calc(14px + env(safe-area-inset-top,0px));right:16px;background:#fff;color:#000;border:0;border-radius:999px;width:40px;height:40px;font-size:1.3rem;cursor:pointer}
.fade{animation:fade .35s ease}
@keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important;scroll-behavior:auto!important}}
</style>
</head>
<body>

<header class="top">
  <div class="wrap">
    <a class="brand" href="#/" data-nav="top"><span class="logo">O</span><span id="brandName">Obediah Books</span></a>
    <nav class="menu">
      <a class="link" data-go="books">Books</a>
      <a class="link" data-go="how">How to buy</a>
      <a class="link" data-go="about">About</a>
      <a class="btn btn-wa btn-sm" id="navWa" target="_blank" rel="noopener">WhatsApp</a>
    </nav>
  </div>
</header>

<main id="app"></main>

<a class="fab" id="fab" target="_blank" rel="noopener" aria-label="Chat on WhatsApp">
  <svg viewBox="0 0 32 32" fill="currentColor" aria-hidden="true"><path d="M16.04 3C9.4 3 4 8.4 4 15.04c0 2.13.56 4.2 1.62 6.03L4 29l8.1-1.58a12 12 0 0 0 3.94.66C22.68 28.08 28 22.68 28 16.04 28 9.4 22.68 3 16.04 3Zm0 21.97c-1.2 0-2.37-.2-3.48-.6l-.5-.18-4.8.94.98-4.67-.2-.52a9.9 9.9 0 0 1-1.5-5.28c0-5.5 4.48-9.98 9.98-9.98s9.98 4.48 9.98 9.98-4.48 10.3-9.46 10.3Zm5.47-7.48c-.3-.15-1.77-.87-2.04-.97-.27-.1-.47-.15-.67.15-.2.3-.77.97-.94 1.17-.17.2-.35.22-.65.07-.3-.15-1.27-.47-2.42-1.5a9.1 9.1 0 0 1-1.68-2.08c-.18-.3-.02-.46.13-.6.13-.14.3-.35.45-.52.15-.17.2-.3.3-.5.1-.2.05-.37-.03-.52-.07-.15-.67-1.62-.92-2.22-.24-.58-.49-.5-.67-.5h-.57c-.2 0-.52.07-.8.37-.27.3-1.04 1.02-1.04 2.48 0 1.46 1.07 2.88 1.22 3.08.15.2 2.1 3.2 5.08 4.5.7.3 1.26.48 1.69.62.7.22 1.35.2 1.86.12.57-.08 1.77-.72 2.02-1.42.25-.7.25-1.3.17-1.42-.07-.12-.27-.2-.57-.35Z"/></svg>
  <span>Chat with us</span>
</a>

<footer>
  <div class="wrap">
    <div>
      <strong style="color:#fff;font-family:var(--font-head);font-size:1.15rem" id="footBrand">Obediah Books</strong><br>
      <small>Simple, practical books by <span id="footOwner"></span></small>
    </div>
    <div><a id="footWa" target="_blank" rel="noopener">Order or ask a question on WhatsApp</a><br><small id="footYear"></small></div>
  </div>
</footer>

<div class="lb" id="lb" role="dialog" aria-label="Book preview"><button aria-label="Close">×</button><img id="lbImg" alt=""></div>

<script>
/* =====================================================================
   EDIT THIS PART ONLY
   1) SITE   -> your shop name and WhatsApp number (international format, no + or spaces)
   2) BOOKS  -> one block per book. To add a book, copy a whole block {...},
                paste it after the last one (with a comma), change the words.
   ===================================================================== */
const SITE = {

  currency: '₦'

const BOOKS = [
  {
    id: 'automate-your-receivables',
    title: 'Automate Your Receivables',
    subtitle: 'Build a Smart Accounts Receivable Management System in Excel, with AI as Your Assistant',
    short: 'Stop chasing debtors with a notebook. Build an Excel system that tracks, colours and reminds, explained so simply a child can follow.',
    category: 'Excel · Accounting · AI',
    price: 5000,
    format: 'PDF',
    pages: 101,

    description: [

      '<b>Automate Your Receivables</b> walks you, step by step, through building a complete Accounts Receivable system in Microsoft Excel. You type each fact once. Excel does the rest: it works out due dates, balances, days overdue and aging, colours the late payers red, and even writes the reminder messages.',
      'Every formula is explained like a sentence, with shop stories and simple pictures. You also learn how to use a free AI assistant (ChatGPT, Claude, Gemini or Copilot) to write formulas, fix errors and draft messages, and how to check its answers so a wrong formula never reaches your customers.'
    ],
    learn: [
      'Understand Accounts Receivable using simple shop stories',
      'Use only the Excel you really need (IF, VLOOKUP, SUMIFS and more), taught from zero',
      'Build Customers, Invoices and Payments sheets that work together',
      'Calculate due dates, balances, status and days overdue automatically',
      'Create an Aging Report that checks itself',
      'Build a dashboard with totals, a chart and your top 5 debtors',
      'Make a one-click Customer Statement',
      'Generate friendly, firm and final reminder messages',
      'Use AI as a helper, with prompts you can copy and paste',
      'Test your system with an Answer Key so you know it is correct'
    ],
    forWho: [
      'Small business owners who sell on credit and are tired of notebooks',
      'Accounting and business students who want a real, practical project',
      'Bookkeepers and accounts staff who want to work faster with fewer mistakes',
      'Freelancers and service providers who send invoices and chase payments',
      'Complete beginners. No programming and no advanced Excel needed'
    ],
    notFor: [
      'You need a computer with Microsoft Excel to build the system (the book can be read on any phone)',
      'This is a learning guide. It is not a ready-made Excel file and not legal or tax advice'
    ],

let pendingScroll = null, view = 'home';

function setupChrome() {
  $('#brandName').textContent = SITE.name;
  $('#footBrand').textContent = SITE.name;
  $('#footOwner').textContent = SITE.owner;
  $('#footYear').textContent = '© ' + new Date().getFullYear() + ' ' + SITE.owner + '. All rights reserved.';
  const general = wa('Hello ' + SITE.owner.split(' ')[0] + ', I have a question about your books.');
  ['#navWa', '#fab', '#footWa'].forEach(s => $(s).href = general);
}

function card(b) {
  return `<a class="card fade" href="#/book/${b.id}" aria-label="View details of ${b.title}">
    <div class="cv"><img src="${b.cover}" alt="Cover of ${b.title}" loading="lazy"></div>
    <div class="bd">
      <div class="chips"><span class="chip">${b.format} · ${b.pages} pages</span><span class="chip">${b.level}</span></div>
      <h3>${b.title}</h3>
      <p class="sub">${b.short}</p>
      <div class="price-row"><span class="price">${money(b.price)}</span><span class="btn btn-gold btn-sm">View details</span></div>
    </div></a>`;
}

  document.body.classList.remove('bookpage');

  <section id="about"><div class="wrap">
    <div class="about">
      <div class="avatar" aria-hidden="true">${SITE.owner.charAt(0)}</div>
      <div><div class="kicker">About the author</div>
      <h3 style="margin-bottom:.3rem">${SITE.owner}</h3>
      <p style="margin:0;color:var(--muted)">An accounting graduate (B.Sc. Accountancy, Rivers State University, Nigeria). He writes practical books that make accounting automation easy for beginners, using tools they already have and language anyone can follow.</p></div>
    </div>
  </div></section>`;
  window.scrollTo(0, 0);
  if (pendingScroll) { const id = pendingScroll; pendingScroll = null; setTimeout(() => { const e = document.getElementById(id); e && e.scrollIntoView(); }, 30); }
}

function renderBook(b) {
  view = 'book';
  document.body.classList.add('bookpage');
  document.title = b.title + ' | ' + SITE.name;
  const buy = buyLink(b);
  const ask = wa('Hello ' + SITE.owner.split(' ')[0] + ', I have a question about the book "' + b.title + '".');
  app.innerHTML = `
  <div class="wrap fade">
    <a class="crumb" href="#/">← All books</a>
    <div class="bk">
      <div class="left"><div class="frame"><img src="${b.cover}" alt="Cover of ${b.title}"></div></div>
      <div>
        <div class="chips" style="margin-bottom:12px"><span class="chip">${b.category}</span><span class="chip">${b.format} · ${b.pages} pages</span><span class="chip">${b.level}</span></div>
        <h1>${b.title}</h1>
        <p class="sub">${b.subtitle}</p>
        <div class="buybox">
          <div class="big">${money(b.price)}</div>
          <div class="once">One-time payment · ${b.format} you keep forever</div>
          <div class="btns">
            <a class="btn btn-gold btn-lg" target="_blank" rel="noopener" href="${buy}">${WA_ICON} Buy Now on WhatsApp</a>
            <a class="btn btn-line" target="_blank" rel="noopener" href="${ask}">Ask a question</a>
          </div>
          <ul class="trust">
            <li>Order in a simple WhatsApp chat. No account needed</li>
            <li>Readable on phone, tablet or computer</li>
            <li>Written so a beginner can follow every step</li>
          </ul>
        </div>
        <div class="quote">${b.hook}<small>${b.edition} · by ${SITE.owner}</small></div>
        <div class="blk" style="margin-top:28px">${b.description.map(p => '<p>' + p + '</p>').join('')}</div>
      </div>
    </div>

    <div class="blk"><div class="kicker">What you will learn</div><h2>By the end of this book, you will be able to…</h2>
      <div class="learn">${b.learn.map(x => '<div class="it">' + x + '</div>').join('')}</div></div>

    <div class="blk"><div class="kicker">Look inside</div><h2>A peek at the pages</h2><p style="color:var(--muted)">Tap a page to enlarge it.</p>
      <div class="previews">${b.previews.map((p, i) => `<button class="pv" data-pv="${i}"><img src="${p.src}" alt="${p.cap}" loading="lazy"><span>${p.cap}</span></button>`).join('')}</div></div>

    <div class="blk"><div class="kicker">Who is it for?</div><h2>Is this book right for you?</h2>
      <div class="two">
        <div class="panel"><h3>This book is for you if…</h3><ul class="ticks">${b.forWho.map(x => '<li>' + x + '</li>').join('')}</ul></div>
        <div class="panel"><h3>Please note</h3><ul class="ticks x">${b.notFor.map(x => '<li>' + x + '</li>').join('')}</ul></div>
      </div></div>

    <div class="blk"><div class="kicker">What is inside</div><h2>Table of contents</h2>
      ${b.parts.map((p, i) => `<details ${i === 1 ? 'open' : ''}><summary>${p.t}</summary><div class="in"><ul>${p.items.map(x => '<li>' + x + '</li>').join('')}</ul></div></details>`).join('')}</div>

    <div class="blk"><div class="kicker">Book details</div><h2>The facts</h2>
      <div class="panel"><table class="table">
        <tr><td>Author</td><td>${SITE.owner}</td></tr>
        <tr><td>Format</td><td>${b.format} (digital download)</td></tr>
        <tr><td>Length</td><td>${b.pages} pages</td></tr>
        <tr><td>Level</td><td>${b.level}</td></tr>
        <tr><td>Edition</td><td>${b.edition}</td></tr>
        <tr><td>Price</td><td>${money(b.price)}</td></tr>
      </table></div></div>

    <div class="blk"><div class="kicker">Questions</div><h2>Frequently asked questions</h2>
      ${b.faq.map(q => `<details><summary>${q[0]}</summary><div class="in">${q[1]}</div></details>`).join('')}</div>

    <div class="final">
      <h2 style="color:#fff">Ready to stop chasing and start collecting?</h2>
      <p>Get <b>${b.title}</b> today and build your own smart system, one simple step at a time.</p>
      <a class="btn btn-gold btn-lg" target="_blank" rel="noopener" href="${buy}">${WA_ICON} Buy Now · ${money(b.price)}</a>
    </div>
  </div>

  <div class="stickybuy"><div class="p">${money(b.price)}<small>${b.format} · ${b.pages} pages</small></div>
    <a class="btn btn-gold" target="_blank" rel="noopener" href="${buy}">${WA_ICON} Buy Now</a></div>`;
  window.scrollTo(0, 0);
  app.querySelectorAll('[data-pv]').forEach(btn => btn.addEventListener('click', () => {
    const p = b.previews[+btn.dataset.pv];
    $('#lbImg').src = p.src; $('#lbImg').alt = p.cap; $('#lb').classList.add('on');
  }));
}

function route() {
  const m = (location.hash || '#/').match(/^#\/book\/(.+)$/);
  if (m) {
    const b = BOOKS.find(x => x.id === decodeURIComponent(m[1]));
    if (b) return renderBook(b);
  }
  renderHome();
}

document.addEventListener('click', e => {
  const g = e.target.closest('[data-go]');
  if (!g) return;
  e.preventDefault();
  const id = g.dataset.go;
  if (view !== 'home') { pendingScroll = id; location.hash = '#/'; }
  else { const el = document.getElementById(id); el && el.scrollIntoView(); }
});
$('#lb').addEventListener('click', () => $('#lb').classList.remove('on'));
document.addEventListener('keydown', e => { if (e.key === 'Escape') $('#lb').classList.remove('on'); });
window.addEventListener('hashchange', route);

setupChrome();
route();
</script>
</body>
</html>
